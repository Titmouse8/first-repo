components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    Category:
      type: object
      properties:
        category_name:
          type: string
          maxLength: 50
      required:
      - category_name
    MenuItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        item_name:
          type: string
          maxLength: 50
        category:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 200
      required:
      - category
      - description
      - id
      - item_name
      - price
    Order:
      type: object
      properties:
        order_id:
          type: integer
          readOnly: true
        user:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        delivery_crew:
          type: integer
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        total_price:
          type: string
          readOnly: true
      required:
      - created_at
      - items
      - order_id
      - total_price
      - user
    OrderItem:
      type: object
      properties:
        menuitem_name:
          type: string
        menuitem_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 65535
          minimum: 0
        item_subtotal:
          type: string
          readOnly: true
      required:
      - item_subtotal
      - menuitem_name
      - menuitem_price
      - quantity
    PasswordResetConfirm:
