<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        {% load static %}
        <title>Little Lemon</title>
    </head>
    <body>
        <h1>Make your reservation</h1>

        <form action="POST" id="book_form">
            {% csrf_token %}
            <p>
                <label for="name">Name: </label>
                <input type="text" placeholder="Your Full Name" maxlength="20" required="" id="name">
            </p>
            <p>
                <label for="reservation_date">Date of reservation: </label>
                <input type="date" id="reservation_date">
            </p>
            <p>
                <label for="reservation_slot">Time of reservation</label>
                <input type="time">
                <!--<select id="reservation_slot">
                    <option value="0" disabled>Select time</option>
                </select> -->
            </p>
            <p>
                <button type="button" id="button">Reserve</button>
            </p>

        </form>
        <h2>Bookings for <span id="today"></span></h2>
        <div id="bookings">

        </div>

        <script>
            const date = new Date();
            document.getElementById('reservation_date').value = `${date.getFullYear()}-${(date.getMonth() +1).toString().padStart(2,'0')}-${date.getDate().toString().padStart(2,'0')}`;
            //getMonth() – vráti mesiac od 0 do 11, preto sa pridáva +1, aby si dostal bežné číslovanie mesiacov (1–12).
            //padStart(2, '0') – zabezpečí, že čísla menšie ako 10 budú mať pred sebou nulu (napr. 7 → "07").
            //Celý zápis vytvorí string vo formáte "YYYY-MM-DD" – čo je štandardný formát pre HTML input typu date.
            console.log(document.getElementById('reservation_date').value);
            getBookings();

            document.getElementById('reservation_date').addEventListener('change', function(){
                getBookings()
            });

            function getBookings() {
                let reserved_slots = [];
                const date = document.getElementById('reservation_date').value;
                document.getElementById('today').innerHTML = date;

                fetch ('http://127.0.0.1:8000/bookings/'  + '?date=' + date)
                .then (r => r.json())
                .then (data => {
                    reserved_slots = []
                    bookings = ''
                    for (item of data) {
                        console.log(item.fields)
                        reserved_slots.push(item.fields.reservation_slot)
                        bookings += `<p>${item.fields.name} - ${formatTime(item.fields.reservation_slot)}</p>`
                    };
                    slot_options = '<option value="0" disabled> Select time </option>'
                    for (i=10; i<=20; i++){
                        const label = formatTime(i);
                        if (reserved_slots.includes(i)) {
                            slots_options += `<option value=${i} disabled> $[label] </option>`
                        } else {
                            slots_options += `<option value=${i}> $[label] </option>`
                        }
                    };

                    document.getElementById('reservation_slot').innerHTML = slot_options;
                    if (bookings == ''){
                        bookings = 'No bookings'
                    };
                    dokument.getElementById('bookings').innerHTML = bookings;
                });
            };

            function formatTime(time) {
                const ampm = time < 12 ? "AM" : "PM";
                const t = time < 12 ? time : time > 12 ? time - 12 : time;
                const label = `${t} ${ampm}`;
                return label;
            };

            document.getElementById('button').addEventListener('click', function(e){
                const formdata = {
                    name: document.getElementById('name').value,
                    reservation_date: document.getElementById('reservation_date').value,
                    reservation_slot: document.getElementById('reservation_slot').value,
                };
                fetch("http://127.0.0.1:8000/api/bookings/", {method: 'post', body: JSON.stringify(formdata)})
                .then(r => r.text())
                .then(data => {
                    getBookings()
                });
            })



            console.log('Hello!');
            document.getElementById('id_reservation_id').type='date'
        </script>
</html>
